<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OTT 스트리밍 시연</title>
  <style>
    body { margin: 0; background: #10151d; color: #e9edf4; font: 16px system-ui, sans-serif; }
    main { max-width: 800px; margin: 7vh auto; padding: 0 24px; }
    h1 { font-size: clamp(1.7rem, 5vw, 2.5rem); }
    video { display: block; width: 100%; aspect-ratio: 16 / 9; background: #000; border-radius: 12px; }
    form { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 16px; }
    input { flex: 1 1 16rem; min-width: 0; padding: .7em; border: 1px solid #72859c;
            border-radius: 8px; font: inherit; }
    button { padding: .7em 1em; background: #b6e5ff; color: #10151d;
             border: 0; border-radius: 8px; font: inherit; font-weight: 650; cursor: pointer; }
    p { color: #b9c5d5; }
  </style>
  <script defer src="/vendor/hls.min.js"></script>
  <script defer src="/player.js"></script>
</head>
<body>
  <main>
    <h1>OTT 스트리밍 시연</h1>
    <video controls playsinline preload="metadata" aria-label="콘텐츠 영상"></video>
    <form>
      <label for="content-id">콘텐츠 ID</label>
      <input id="content-id" name="contentId" value="movie-001" required spellcheck="false" autocomplete="off">
      <button type="submit">영상 불러오기</button>
    </form>
    <p role="status"></p>
  </main>
</body>
</html>
